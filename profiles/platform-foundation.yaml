rule_groups:
  - platform.core
  - platform.security
  - platform.delivery
  - platform.fairway
recommended_rules:
  - platform.contract-first
  - platform.evidence-before-done
  - platform.error-envelope-correlation-id
  - platform.api-first-ops-verification
  - delivery.deploy-run-required
